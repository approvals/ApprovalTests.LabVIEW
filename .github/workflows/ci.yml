name: ci-checks
on:
  push:
  workflow_dispatch:
env: 
  PACKAGE_VERSION: 3.0.0
permissions:
  checks: write
  pull-requests: write # only required if `comment: true` was enabled

jobs:
  PylaviChecks:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Pylavi
        run: |
          pip install pylavi
          ./scripts/pylavi_check.sh

  Test_And_Build:
    needs: PylaviChecks
    runs-on: ubuntu-latest
    # LabVIEW container defaults to `sh`. Set it to `bash`, so there are no surprises with syntax in the steps.
    defaults:
      run:
        shell: bash

    # The official LabVIEW container image from NI
    container:
      image: nationalinstruments/labview:2026q3-linux
      # --init injects a real init (tini) as PID 1 ahead of the entrypoint so orphaned/killed LabVIEW processes actually get reaped instead of piling up as zombies.
      options: --init

    env:
      LABVIEW_IMAGE: 2026q3-linux
      VIPM_RELEASE_TYPE: preview
      VIPM_VERSION: 26.3.0-3991
      VIPM_COMMUNITY_EDITION: true
      VIPM_DESKTOP_LIVELINESS_TIMEOUT: 600
      VIPM_NON_INTERACTIVE: 1    
      VIPM_ASSUME_YES: 1
      VIPM_DEBUG: 0

    steps:
      - name: Install git
        run: |
          apt-get update && apt-get install -y git >/dev/null
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Container
        run: |
          ./scripts/setup_container.sh
      # Use GitHub's caching action to cache VIPM's package cache.
      - name: Cache VIPM packages
        id: cache-vipm
        uses: actions/cache@v5
        env:
          # Increment this to invalidate the cache (restore-keys included).
          CACHE_VERSION: 2
        with:
          path: |
            /usr/local/natinst/LabVIEW*/
            /usr/local/jki/vipm/cache/
            /usr/local/jki/vipm/db/
          # Key includes hashes of the project package manifests (.vipc and .dragon files)
          key: vipm-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ env.LABVIEW_IMAGE }}-${{ env.VIPM_VERSION }}-${{ hashFiles('approvals-dev.vipc', 'error.dragon') }}
          restore-keys: |
            vipm-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ env.LABVIEW_IMAGE }}-${{ env.VIPM_VERSION }}-
            vipm-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ env.LABVIEW_IMAGE }}-
      - name: Activate VIPM
        run: |
          source ./scripts/setup_display.sh
          echo "Starting LabVIEW"
          /usr/local/natinst/LabVIEW-${LABVIEW_VERSION_YEAR}-64/labview --headless &
          echo "Activating VIPM"
          vipm activate --serial-number "${{ secrets.VIPM_SERIAL_NUMBER }}" --name "${{ secrets.VIPM_FULL_NAME }}" --email "${{ secrets.VIPM_EMAIL}}" >/dev/null
          vipm about
          vipm refresh # --show-progress # --verbose >/dev/null

      - name: VIPM Install Packages
        if: steps.cache-vipm.outputs.cache-hit != 'true'
        run: |
          source ./scripts/setup_display.sh
          echo "Starting LabVIEW"
          /usr/local/natinst/LabVIEW-${LABVIEW_VERSION_YEAR}-64/labview --headless &
          vipm install "approvals-dev.vipc" --show-progress --labview-version ${LABVIEW_VERSION_YEAR} --labview-bitness 64 # --verbose

      - name: VIPM List Installed packages
        run: |
          source ./scripts/setup_display.sh
          vipm list --installed || true

      - name: Unit Tests
        run: |
          source ./scripts/setup_display.sh
          ./scripts/run_unittests.sh kill

      - name: VIPM Build Package
        run: |
          source ./scripts/setup_display.sh
          echo "Updating release notes"
          apt-get update && apt-get install -y xmlstarlet dos2unix >/dev/null
          xmlstarlet ed --inplace -u VI_Package_Builder_Settings/Advanced_Settings/Description/Release_Notes --value "$(dos2unix release-notes.txt && cat release-notes.txt)" "Approval Tests.vipb"
          echo "Starting LabVIEW"
          /usr/local/natinst/LabVIEW-${LABVIEW_VERSION_YEAR}-64/labview --headless &
          vipm build "Approval Tests.vipb" --labview-version ${LABVIEW_VERSION_YEAR} --labview-bitness 64 --show-progress --version-number ${PACKAGE_VERSION} --build-number ${GITHUB_RUN_NUMBER} # --verbose

      - name: Upload Built Package as Artifact
        if: true
        uses: actions/upload-artifact@v7
        with:
          name: vi-package-${{ env.PACKAGE_VERSION }}.${{ github.run_number }}
          path: |
            build/*.vip

      - name: Upload VIPM and LabVIEW Settings as Artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_and_build_settings
          path: |
            /usr/local/jki/vipm/Settings.ini
            /github/home/natinst/.config/LabVIEW-${{ env.LABVIEW_VERSION_YEAR }}/labview*
            /tmp/xvfb.log

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'reports/*UnitTestReport.xml'
          include_passed: true
          
      - name: Grab Artifacts
        if: success() || failure() # always run even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: pre-build-test-reports 
          path: |
            reports
            **/*.received.*


  Install_and_Test:
    # This separate job is necessary to install on a fresh machine. This plus the testes verify that we got all dependencies correct.
    needs: Test_And_Build
    runs-on: ubuntu-latest

    # LabVIEW container defaults to `sh`. Set it to `bash`, so there are no surprises with syntax in the steps.
    defaults:
      run:
        shell: bash

    # The official LabVIEW container image from NI
    container:
      image: nationalinstruments/labview:2026q3-linux
      # --init injects a real init (tini) as PID 1 ahead of the entrypoint so orphaned/killed LabVIEW processes actually get reaped instead of piling up as zombies.
      options: --init

    env:
      LABVIEW_IMAGE: 2026q3-linux
      VIPM_RELEASE_TYPE: preview
      VIPM_VERSION: 26.3.0-3991
      VIPM_COMMUNITY_EDITION: true
      VIPM_DESKTOP_LIVELINESS_TIMEOUT: 600
      VIPM_NON_INTERACTIVE: 1
      VIPM_ASSUME_YES: 1
      VIPM_DEBUG: 0

    steps:

     

      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Container
        run: |
          ./scripts/setup_container.sh

      - name: Refresh VIPM
        run: |
          source ./scripts/setup_display.sh
          echo "Starting LabVIEW"
          /usr/local/natinst/LabVIEW-${LABVIEW_VERSION_YEAR}-64/labview --headless &
          # echo "Activating VIPM"
          # vipm activate --serial-number "${{ secrets.VIPM_SERIAL_NUMBER }}" --name "${{ secrets.VIPM_FULL_NAME }}" --email "${{ secrets.VIPM_EMAIL}}" >/dev/null
          vipm about
          vipm refresh # --show-progress # --verbose >/dev/null

      - name: Download the uploaded artifact
        uses: actions/download-artifact@v8
        with:
          name: vi-package-${{ env.PACKAGE_VERSION }}.${{ github.run_number }}    # Must match the upload name exactly

      - name: Install new package and Caraya LUnit
        run: |
          source ./scripts/setup_display.sh
          package=$(ls *.vip)
          echo "Package is ${package}"
          vipm install "${package}" astemes_lib_lunit astemes_lib_lunit_parameterized_add_on sas_workshops_lib_lunit_for_g_cli jki_lib_caraya lvos_lib_caraya_cli_extension sas_workshops_lib_switcheroo_for_g_cli

      - name: VIPM List Installed Packages
        run: |
          source ./scripts/setup_display.sh
          vipm list --installed || true

      - name: Create Install Tests
        run: |
          source ./scripts/setup_display.sh
          ./scripts/create_install_tests.sh
      
      - name: Run Install Tests
        run: |
          source ./scripts/setup_display.sh
          ./scripts/run_install_tests.sh kill

      - name: Upload VIPM and LabVIEW Settings as Artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_and_build_settings
          path: |
            /usr/local/jki/vipm/Settings.ini
            /github/home/natinst/.config/LabVIEW-${{ env.LABVIEW_VERSION_YEAR }}/labview*
            /tmp/xvfb.log

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'reports/*UnitTestReport.xml'
          include_passed: true
          
      - name: Grab Artifacts
        if: success() || failure() # always run even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: post-install-test-reports 
          path: |
            reports
            **/*.received.*

   
  PylaviChecks_on_Build:
    runs-on: ubuntu-latest
    needs: Test_And_Build
    container:
      image: python:3.11
    steps:
      - name: Download the uploaded artifact
        uses: actions/download-artifact@v8
        with:
          name: vi-package-${{ env.PACKAGE_VERSION }}.${{ github.run_number }}    # Must match the upload name exactly
      - name: Pylavi
        run: |
          pip install pylavi
          mkdir -p source
          unzip sas_lib_approval_tests-${{ env.PACKAGE_VERSION }}.*.vip -d source
          cd source
          [ ! -d "Packages" ] || { echo "Error: Packages directory found. Must be system package. Check paths."; exit 1; }
          vi_validate -l 21 -g 20
  